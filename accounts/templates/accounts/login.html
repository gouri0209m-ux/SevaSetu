{% extends 'base.html' %}

{% block title %}Login | SevaSetu{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <span class="eyebrow">Welcome back</span>
        <h1 class="page-title">Sign in to SevaSetu.</h1>
        <p class="page-intro">Access your account and continue supporting causes.</p>
    </div>
</section>

<section class="form-section">
    <div class="container">
        <div class="auth-card form-card">
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="form-field">
                    <label for="username">Username</label>
                    <input id="username" name="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-accent w-100">Login</button>
            </form>

            <p class="auth-switch">New to SevaSetu? <a href="{% url 'register' %}">Create an account</a></p>
        </div>
    </div>
</section>
{% endblock %}
