{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

<h2>Login</h2>

<form method="post">

{% csrf_token %}

<input
name="username"
class="form-control mb-3"
placeholder="Username">

<input
name="password"
type="password"
class="form-control mb-3"
placeholder="Password">

<button class="btn btn-success">
Login
</button>

</form>

</div>

{% endblock %}
