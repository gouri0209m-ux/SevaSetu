{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

<h1 class="mb-4">
Campaigns
</h1>

<div class="row">

{% for campaign in campaigns %}

<div class="col-md-4 mb-4">

<div class="card shadow-sm h-100">

{% if campaign.image %}
<img src="{{ campaign.image.url }}"
     class="card-img-top">
{% endif %}

<div class="card-body">

<h5>
{{ campaign.title }}
</h5>

<p>
{{ campaign.description|truncatewords:15 }}
</p>

<a href="{% url 'campaign_detail' campaign.id %}"
   class="btn btn-success">

View Details

</a>

</div>

</div>

</div>

{% endfor %}

</div>

</div>

{% endblock %}
